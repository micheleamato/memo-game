name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
          repository_root: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoGame-APK
          path: bin/*.apk

